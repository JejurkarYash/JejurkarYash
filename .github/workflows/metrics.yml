name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Language breakdown
        uses: lowlighter/[email protected]
        with:
          filename: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: github
          plugin_languages_sections: chart-donut
          plugin_languages_limit: 8
          config_theme: dark

      - name: Profile stats
        uses: lowlighter/[email protected]
        with:
          filename: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, repositories, metadata
          config_theme: dark
